version: '3.8'

services:
  # Banco de Dados
  postgres:
    image: postgres:15
    container_name: pedidos-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: pedidos_db
    ports:
      - "5432:5432"
  rabbitmq:
    image: rabbitmq:3-management
    container_name: pedidos-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS}
    ports:
      - "5672:5672"   # Porta onde a nossa aplicação Java se conecta
      - "15672:15672" # Porta para o painel visual no seu navegador
