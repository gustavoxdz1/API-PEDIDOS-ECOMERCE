# 1. Configuração do próprio Microsserviço Java
spring.application.name=pedidos-service
server.port=8080

# ----------------------------------------
# 2. Configurações do Banco de Dados (PostgreSQL)
# ----------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/pedidos_db
spring.datasource.username=postgres
spring.datasource.password=1914
spring.datasource.driver-class-name=org.postgresql.Driver

# Regras do Hibernate para criar tabelas e mostrar o SQL no terminal
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ----------------------------------------
# 3. Configurações de Mensageria (RabbitMQ)
# ----------------------------------------
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=rabit1
spring.rabbitmq.password=130206